name: ids-bench-fabric
version: "2.0.0"

caliper:
  blockchain: fabric

channels:
  - channelName: mychannel
    contracts:
      - id: idsledger

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: User1
          clientPrivateKey:
            path: __ORG1_KEY__
          clientSignedCert:
            path: __ORG1_CERT__
    connectionProfile:
      path: ./networks/org1ccp.yaml
      discover: true
